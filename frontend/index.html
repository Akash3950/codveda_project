<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">

</head>

<body>
    <header>
        <h1>User Directory</h1>
    </header>

    <main>
        <img style="width: 400px;"
            src="https://media.licdn.com/dms/image/v2/D4E0BAQFgCv6yZzuMOQ/company-logo_200_200/B4EZaoghnwH4AI-/0/1746583821709/codveda_technologies_logo?e=2147483647&v=beta&t=M1I-QlgVh9GW2MXPBlqO3VbyoU6_8iDPNw4lci5vmKI"
            alt="">
        <button class="btn" onclick="fetchUsers()">Load Users</button>
        <div id="userList" class="users"></div>
    </main>

    <script>
        function fetchUsers() {
            fetch('https://jsonplaceholder.typicode.com/users')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to fetch users");
                    }
                    return response.json();
                })
                .then(users => {
                    const userList = document.getElementById('userList');
                    userList.innerHTML = '';
                    users.forEach(user => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
              <h3>${user.name}</h3>
              <p><strong>Email:</strong> ${user.email}</p>
              <p><strong>Phone:</strong> ${user.phone}</p>
              <p><strong>Company:</strong> ${user.company.name}</p>
            `;
                        userList.appendChild(card);
                    });
                })
                .catch(error => {
                    alert(error.message);
                });
        }
    </script>
</body>

</html>
